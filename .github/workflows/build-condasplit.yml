name: Test condasplit

# the image is published by the Wave release, see the `Publish condasplit image` step in build.yml
on:
  pull_request:
    paths:
      - 'condasplit/**'
      - '.github/workflows/build-condasplit.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # the owner tests need root, they are skipped otherwise
    container:
      image: golang:1.27
      options: --user root
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run tests
        working-directory: condasplit
        run: |
          go vet ./...
          go test ./...
          cd frontend && go vet ./... && go test ./...

  # fails when the sources change without a VERSION bump, otherwise the next Wave release fails
  # to publish the image, see `make check`
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check the VERSION tag
        run: make -C condasplit check registry=public.cr.seqera.io/wave
