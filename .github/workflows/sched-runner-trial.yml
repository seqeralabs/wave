name: Sched runner trial

# Trial of the sched GitHub Actions runners (webhook mode, App sched-runners-dev):
# the compile and test steps of build.yml, on a runner launched by dev sched for
# this job (8 vCPU / 32 GiB on an m7a or m7i Spot VM, the same runner shape as the
# Nextflow CI). The file lives only on the trial branch, so it runs only for its
# PR; Wave CI is unchanged.
on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

jobs:
  test:
    name: Build and test (sched runner)
    runs-on: sched/run=${{ github.run_id }}-test/cpu=8/mem=32/type=m7a+m7i/spot=true
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          submodules: true

      - name: Runner
        run: nproc && free -m && df -h / && docker info --format 'dockerd {{.ServerVersion}}'

      - name: Setup Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 25
          distribution: 'corretto'
          architecture: x64
          cache: gradle

      # processResources builds the TypeSpec API (npm), which the stock actions-runner
      # image lacks; same Node version as typespec.yml
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.0'

      - name: Compile
        run: make compile
        env:
          GRADLE_OPTS: '-Dorg.gradle.daemon=false'

      - name: Tests
        run: make check
        env:
          GRADLE_OPTS: '-Dorg.gradle.daemon=false'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{secrets.TOWER_CI_AWS_ACCESS}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.TOWER_CI_AWS_SECRET}}
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
          QUAY_USER: "pditommaso+wave_ci_tests"
          QUAY_PAT: ${{ secrets.QUAY_PAT }}
          AZURECR_USER: ${{ secrets.AZURECR_USER }}
          AZURECR_PAT: ${{ secrets.AZURECR_PAT }}
          GOOGLECR_KEYS: ${{ secrets.GOOGLECR_KEYS }}

      # Container builds in the tests write root-owned files under the workspace
      - name: Cleanup build workspace
        if: always()
        run: sudo rm -rf "${GITHUB_WORKSPACE}/build-workspace"

      - name: Publish tests report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-sched-runner
          path: |
            **/build/reports/tests/test
